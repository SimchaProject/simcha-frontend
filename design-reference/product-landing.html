<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Simcha — product landing (couples) reference</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bellefair&family=Frank+Ruhl+Libre:wght@500;700&family=Rubik:wght@400;500&display=swap">
<style>
  body { background:#F1EFE8; margin:0; font-family:'Rubik',sans-serif; }
  .shell { max-width:760px; margin:0 auto; background:#EFE6D2; color:#241A14; border:0.5px solid #C9B98D; }
  .nav { display:flex; align-items:center; justify-content:space-between; padding:18px 32px; border-bottom:0.5px solid #C9B98D; }
  .logo { font-family:'Bellefair',serif; font-size:22px; color:#B23A2E; }
  .nav-right { display:flex; align-items:center; gap:18px; font-size:13px; }
  .login-link { color:#5A4D3A; cursor:pointer; }
  .signup-btn { border:1.5px solid #B23A2E; color:#B23A2E; border-radius:20px; padding:7px 18px; cursor:pointer; background:transparent; font-size:13px; font-family:'Rubik',sans-serif; }
  .hero { text-align:center; padding:56px 32px 44px; }
  .eyebrow { font-size:12px; letter-spacing:3px; color:#8C7038; margin:0 0 16px; }
  .headline { font-family:'Bellefair',serif; font-size:44px; line-height:1.3; margin:0 0 18px; }
  .sub { font-size:15px; color:#5A4D3A; max-width:380px; margin:0 auto 30px; }
  .cta-seal { display:inline-flex; width:130px; height:130px; border-radius:50%; border:2px solid #B23A2E; align-items:center; justify-content:center; transform:rotate(-5deg); font-family:'Frank Ruhl Libre',serif; color:#B23A2E; font-size:16px; font-weight:500; text-align:center; cursor:pointer; background:transparent; line-height:1.3; }
  .features { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0; padding:40px 24px; }
  .feature { text-align:center; padding:0 16px; }
  .feature.mid { border-right:0.5px solid #C9B98D; border-left:0.5px solid #C9B98D; }
  .feature-title { font-family:'Frank Ruhl Libre',serif; font-size:15px; font-weight:500; margin:12px 0 6px; }
  .feature-desc { font-size:12px; color:#5A4D3A; line-height:1.6; margin:0; }
</style>
</head>
<body>
  <div class="shell">
    <div class="nav">
      <span class="logo">שמחה</span>
      <div class="nav-right">
        <span class="login-link">כניסה</span>
        <button class="signup-btn">הרשמה</button>
      </div>
    </div>
    <div class="hero">
      <p class="eyebrow">תכנון חתונה, בפשטות</p>
      <p class="headline">כל החתונה שלכם<br/>במקום אחד</p>
      <p class="sub">אישורי הגעה, סידורי הושבה וניהול תקציב — בלי טבלאות אקסל, בלי בלגן.</p>
      <button class="cta-seal">התחילו<br/>בחינם</button>
    </div>
    <svg width="100%" height="26" viewBox="0 0 400 26" preserveAspectRatio="none" style="display:block;">
      <line x1="0" y1="13" x2="400" y2="13" stroke="#8C7038" stroke-width="1"/>
      <g transform="translate(200,13)"><circle r="7" fill="#B23A2E"/><path d="M -3 -7 L 0 -13 L 3 -7" fill="none" stroke="#4F5C3A" stroke-width="1.4"/></g>
    </svg>
    <div class="features">
      <div class="feature">
        <i class="ti ti-checklist" style="font-size:26px;color:#B23A2E;"></i>
        <p class="feature-title">אישורי הגעה</p>
        <p class="feature-desc">טופס פשוט לאורחים, אישור אוטומטי בוואטסאפ</p>
      </div>
      <div class="feature mid">
        <i class="ti ti-armchair" style="font-size:26px;color:#4F5C3A;"></i>
        <p class="feature-title">סידור הושבה חכם</p>
        <p class="feature-desc">אלגוריתם שמסדר את השולחנות בשבילכם</p>
      </div>
      <div class="feature">
        <i class="ti ti-report-money" style="font-size:26px;color:#8C7038;"></i>
        <p class="feature-title">ניהול תקציב</p>
        <p class="feature-desc">מעקב אחר ספקים ותשלומים במקום אחד</p>
      </div>
    </div>
  </div>
</body>
</html>
